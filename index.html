<style>

  #stage{position:relative;width:min(96vw,128dvh,760px);aspect-ratio:4/3;image-rendering:pixelated;box-shadow:0 0 0 4px #241f1b,0 18px 40px #0008;}
  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block;}
  .scan{position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(#0000001f 0 2px,#00000000 2px 4px);}
  #vid{position:absolute;inset:0;z-index:20;background:#0a1020ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;box-sizing:border-box;text-align:center;}
  #vid.hidden{display:none;}
  #vidmsg{display:flex;flex-direction:column;gap:14px;align-items:center;max-width:92%;}
  #vidmsg .hr{font-family:'Press Start 2P',monospace;color:#F4C542;font-size:clamp(20px,6vw,36px);text-shadow:4px 4px 0 #241f1b;}
  #vidmsg .sub{font-family:'VT323',monospace;color:#F4F4E8;font-size:clamp(18px,4.2vw,26px);line-height:1.1;}
  #vidLink{font-family:'VT323',monospace;color:#9cd;font-size:21px;}
  #vidWatch{position:static;transform:none;text-decoration:none;font-family:'VT323',monospace;font-size:clamp(18px,4.6vw,26px);white-space:normal;line-height:1.15;max-width:86vw;}
  #vidWatch:active{transform:translate(4px,4px);box-shadow:0 0 0 #241f1b;}
  #vidClose{position:static;transform:none;}
  #vidClose:active{transform:translate(4px,4px);box-shadow:0 0 0 #241f1b;}
  .btn{position:absolute;z-index:10;left:50%;transform:translateX(-50%);font-family:'Press Start 2P',monospace;background:#F4C542;color:#241f1b;
    border:4px solid #241f1b;box-shadow:5px 5px 0 #241f1b;padding:14px 18px;font-size:clamp(11px,2.6vw,15px);cursor:pointer;}
  .btn:active{transform:translate(-50%,0) translate(5px,5px);box-shadow:0 0 0 #241f1b;}
  .btn.hidden{display:none;}
  #startBtn{bottom:10%;}
  #touch{position:absolute;inset:0;z-index:9;display:none;} #touch.on{display:block;}
  #joy{position:absolute;bottom:calc(6px + env(safe-area-inset-bottom));left:calc(6px + env(safe-area-inset-left));width:104px;height:104px;border-radius:50%;background:#241f1b66;border:3px solid #F4C54299;touch-action:none;}
  #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#F4C542cc;border:3px solid #241f1b;will-change:transform;}
  #swingBtn{position:absolute;bottom:calc(5px + env(safe-area-inset-bottom));right:calc(5px + env(safe-area-inset-right));width:76px;height:76px;border-radius:50%;background:#F4C542;border:3px solid #241f1b;color:#241f1b;font-family:'Press Start 2P',monospace;font-size:11px;box-shadow:3px 3px 0 #241f1b;}
  #swingBtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #241f1b;}
  @media (orientation:landscape){ body{padding:0;} #stage{width:min(100vw,133.3dvh);} }
</style>

  </div>
  <div id="vid" class="hidden">
    <div id="vidmsg">
      <div class="hr">⚾ HOME RUN! ⚾</div>
      <a id="vidWatch" class="btn" href="https://www.youtube.com/watch?v=HtxOsOuY7hA&t=25s" target="_blank" rel="noopener">Klik hier om te zien waar Henk zijn bal landt</a>
    </div>
    <button id="vidClose" class="btn hidden">VERDER ▶</button>
  </div>

</div>
<script>
(() => {
  const cv=document.getElementById('game'), ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
  const startBtn=document.getElementById('startBtn'), touchUI=document.getElementById('touch');
  const W=640,H=480;
  const TOUCH=matchMedia('(pointer:coarse)').matches;

  // ---------- palette ----------
  const OL='#20160F',HAT='#F4C542',HATL='#FFE488',HATD='#C99A2E',SK='#E8B792',SKD='#C98F6B',MUS='#4A3B2A',

    JEAN='#3C5E92',JEAND='#2C4468',JEANL='#4E78B0',BOOT='#6A4327',BOOTD='#4A2E18',BELT='#3A2A1A',EYE='#F7F2E8',
    BLK='#1C1C22',BLKL='#33333C',BLKD='#0E0E12',HAIR='#9A6B3F',HAIRL='#B98B5A';

  // ---------- Henk (detailed, body h=40) ----------
  const HENK_BODY=[
    // short light-brown hair (not spiky)
    [9,6,10,2,HAIR],[8,8,12,2,HAIR],[11,5,4,1,HAIR],
    [7,9,1,2,HAIR],[20,9,1,2,HAIR],[8,10,1,1,HAIR],[19,10,1,1,HAIR],
    [10,6,5,1,HAIRL],[12,5,2,1,HAIRL],[16,7,2,1,HAIRL],[13,6,1,3,'#7A512E'],
    // face
    [9,9,10,9,SK],[8,10,1,7,OL],[19,10,1,7,OL],[9,9,10,1,SKD],[8,12,1,3,SK],[19,12,1,3,SK],
    // nerdy see-through glasses (eyes visible behind lenses)
    [10,13,2,2,EYE],[15,13,2,2,EYE],[11,13,1,2,OL],[16,13,1,2,OL],
    [9,12,4,1,'#2F7BD6'],[9,15,4,1,'#2F7BD6'],[9,12,1,4,'#2F7BD6'],[12,12,1,4,'#2F7BD6'],
    [15,12,4,1,'#2F7BD6'],[15,15,4,1,'#2F7BD6'],[15,12,1,4,'#2F7BD6'],[18,12,1,4,'#2F7BD6'],
    [13,13,2,1,'#2F7BD6'],[8,13,1,1,'#2F7BD6'],[19,13,1,1,'#2F7BD6'],
    [10,12,1,1,'#EAF2FA'],[15,12,1,1,'#EAF2FA'],
    // nose + mustache
    [13,15,2,2,SKD],[10,17,8,2,MUS],[10,17,8,1,'#5C4A33'],[11,19,6,1,SKD],
    [12,19,4,1,SK],
    // black top
    [7,20,14,11,BLK],[7,20,3,1,BLKL],[16,20,3,1,BLKL],[20,20,1,11,BLKD],
    [6,20,1,11,OL],[21,20,1,11,OL],[10,20,8,1,BLKD],[13,20,1,9,BLKL],
    // arms
    [5,21,2,9,BLK],[5,21,1,9,OL],[5,30,2,2,SK],
    [22,21,2,9,BLK],[23,21,1,9,OL],[22,30,2,2,SK],
    // tool belt
    [6,30,16,2,'#5A3A22'],[6,30,16,1,'#6E4A2C'],
    [13,30,2,2,'#C9A24A'],[13,30,2,1,'#E3C878'],
    [7,31,4,3,'#6E4A2C'],[7,33,4,1,'#3E2816'],
    [17,31,4,3,'#6E4A2C'],[17,33,4,1,'#3E2816'],
    [18,29,3,2,'#AEB4BB'],[19,31,1,4,'#8A5A2B'],
    [7,30,1,5,'#C94B2E'],[7,30,1,1,'#E6E6E6'],
    // black pants
    [8,33,5,5,BLK],[8,33,1,5,BLKL],[12,33,1,5,BLKD],
    [15,33,5,5,BLK],[15,33,1,5,BLKL],[19,33,1,5,BLKD],
    [13,33,2,5,'#000000'],
    // black boots
    [7,37,6,3,'#141418'],[7,37,6,1,'#2A2A30'],[7,39,6,1,'#000000'],
    [15,37,6,3,'#141418'],[15,37,6,1,'#2A2A30'],[15,39,6,1,'#000000'],
  ];
  const BAT_STANCE=[[21,19,3,2,SK],[20,18,2,2,'#7A4E27'],[21,15,2,3,'#9A6A3C'],[22,11,2,4,'#B97C3E'],[23,7,3,4,'#8A5A2B'],[23,7,3,1,'#A9713C']];
  const BAT_CONTACT=[[8,22,3,2,SK],[6,22,2,2,'#7A4E27'],[1,21,6,3,'#B97C3E'],[1,21,6,1,'#C98A4B'],[0,20,2,4,'#8A5A2B'],[9,19,4,1,'#F4F4E8']];
  const BAT_FOLLOW=[[9,24,3,2,SK],[6,25,3,2,'#7A4E27'],[1,26,6,3,'#B97C3E'],[0,27,2,3,'#8A5A2B']];
  const HENK_STANCE=[...HENK_BODY,...BAT_STANCE], HENK_CONTACT=[...HENK_BODY,...BAT_CONTACT],
        HENK_FOLLOW=[...HENK_BODY,...BAT_FOLLOW], HENK_RUN=HENK_BODY, HENK_SAD=HENK_BODY;

  // ---------- Chef (h=44) ----------
  const CHEF=[
    [8,0,12,2,'#FFFFFF'],[9,0,3,1,'#FFFFFF'],[7,2,14,4,'#FFFFFF'],[8,2,5,1,'#FFFFFF'],[7,5,14,1,'#E6E6E6'],
    [7,6,14,3,'#FDFDFD'],[7,9,14,2,'#ECECEC'],[7,6,1,5,'#D9D9D9'],[20,6,1,5,'#D9D9D9'],
    [9,11,10,8,SK],[8,12,1,6,OL],[19,12,1,6,OL],[9,11,10,1,SKD],
    [10,13,3,1,MUS],[15,13,3,1,MUS],[10,14,3,2,EYE],[15,14,3,2,EYE],[11,14,2,2,OL],[16,14,2,2,OL],
    [13,15,2,2,SKD],[10,17,8,2,MUS],[12,19,4,1,SK],
    [9,19,10,2,'#C0392B'],[9,19,10,1,'#D9534F'],
    [7,20,14,13,'#FFFFFF'],[20,20,1,13,'#E3E3E3'],[6,20,1,13,OL],[21,20,1,13,OL],
    [9,22,2,2,'#D0D0D0'],[17,22,2,2,'#D0D0D0'],[9,26,2,2,'#D0D0D0'],[17,26,2,2,'#D0D0D0'],[9,30,2,2,'#D0D0D0'],[17,30,2,2,'#D0D0D0'],
    [13,20,2,13,'#EDEDED'],
    [5,21,2,10,'#FFFFFF'],[5,20,1,11,OL],[5,31,2,2,SK],[22,21,2,10,'#FFFFFF'],[23,20,1,11,OL],[22,31,2,2,SK],
    [8,33,5,8,'#D8DBDF'],[15,33,5,8,'#D8DBDF'],[9,34,2,2,'#AEB4BB'],[16,36,2,2,'#AEB4BB'],[11,38,2,2,'#AEB4BB'],[16,34,2,2,'#AEB4BB'],
    [8,33,1,8,'#BFC4CA'],[15,33,1,8,'#BFC4CA'],
    [7,41,6,3,'#20160F'],[15,41,6,3,'#20160F'],[7,41,6,1,'#3A3A3A'],[15,41,6,1,'#3A3A3A'],
  ];
  const CHEF_MAD=[
    [8,0,12,2,'#FFFFFF'],[7,2,14,4,'#FFFFFF'],[7,5,14,1,'#E6E6E6'],[7,6,14,3,'#FDFDFD'],[7,9,14,2,'#ECECEC'],
    [9,11,10,8,'#E24B3C'],[8,12,1,6,OL],[19,12,1,6,OL],[16,12,2,5,'#C23A2C'],
    [10,12,3,1,OL],[15,12,3,1,OL],[11,13,2,2,EYE],[15,13,2,2,EYE],[11,13,2,1,OL],[15,13,2,1,OL],
    [12,16,4,3,'#5A1A12'],[12,18,4,1,'#C23A2C'],[9,19,10,2,'#C0392B'],
    [7,20,14,13,'#FFFFFF'],[20,20,1,13,'#E3E3E3'],[6,20,1,13,OL],[21,20,1,13,OL],
    [9,22,2,2,'#D0D0D0'],[17,22,2,2,'#D0D0D0'],[9,26,2,2,'#D0D0D0'],[17,26,2,2,'#D0D0D0'],[13,20,2,13,'#EDEDED'],
    [3,16,2,10,'#FFFFFF'],[3,15,2,2,SK],[2,15,1,2,OL],[23,16,2,10,'#FFFFFF'],[23,15,2,2,SK],[25,15,1,2,OL],
    [8,33,5,8,'#D8DBDF'],[15,33,5,8,'#D8DBDF'],[7,41,6,3,'#20160F'],[15,41,6,3,'#20160F'],
  ];
  const BALL=[[2,1,6,8,'#F2EFA0'],[1,2,8,6,'#F2EFA0'],[1,2,8,1,'#FBF8C8'],[1,7,8,1,'#CFCB7A'],[3,2,1,6,'#E94B3C'],[6,2,1,6,'#E94B3C']];

  function sprite(data,ox,oy,s){ for(const r of data){ ctx.fillStyle=r[4]; ctx.fillRect(ox+r[0]*s,oy+r[1]*s,r[2]*s,r[3]*s);} }
  function henk(data,x,y,s,bob){ sprite(data,x-14*s,y-40*s-(bob||0),s);
    const ty=y-40*s-(bob||0)+24.5*s;   // chest wordmark on the left breast
    ctx.textAlign='center';ctx.fillStyle='#CBD2D9';ctx.font=Math.max(6,Math.round(s*2.3))+"px 'VT323'";
    ctx.fillText('de vreeden', x+1.5*s, ty);
  }
  function henkAt(data,cx,cy,s,rot){ ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);sprite(data,-14*s,-20*s,s);ctx.restore(); }
  function chef(data,x,y,s,bob){ sprite(data,x-14*s,y-44*s-(bob||0),s); }
  function ball(x,y,s){ sprite(BALL,x-5*s,y-5*s,s); }
  function fielder(x,y,s,cap,shirt){
    sprite([[5,0,6,1,OL],[4,1,8,1,cap],[4,2,2,1,cap],[12,3,3,1,cap],
      [5,3,6,4,SK],[5,3,6,1,SKD],[6,4,1,1,OL],[9,4,1,1,OL],
      [4,7,8,8,shirt],[4,7,8,1,'#ffffff33'],[3,8,2,5,shirt],[11,8,2,5,shirt],
      [11,11,3,3,'#6A4327'],[11,11,3,1,'#8A5A33'],[3,13,2,2,SK],
      [5,15,3,7,'#2C4468'],[8,15,3,7,'#2C4468'],[5,15,1,7,'#3A5680'],
      [5,22,3,2,OL],[8,22,3,2,OL]], x-8*s,y-22*s,s);
  }
  function bodyRects(hair,shirt,pants){ return [
    [4,0,8,1,hair],[4,1,8,1,hair],[11,1,1,2,hair],[4,1,1,2,hair],
    [5,2,6,4,SK],[5,2,6,1,SKD],[6,4,1,1,OL],[9,4,1,1,OL],[5,6,6,1,SKD],
    [4,7,8,8,shirt],[4,7,8,1,'#ffffff30'],[11,7,1,8,'#00000030'],
    [3,8,2,5,shirt],[11,8,2,5,shirt],[3,13,2,2,SK],[11,13,2,2,SK],
    [5,15,3,7,pants],[8,15,3,7,pants],[5,15,1,7,'#ffffff22'],
    [5,22,3,2,OL],[8,22,3,2,OL]]; }
  function person(x,y,s,hair,shirt,pants,scared){
    const ex=scared?[[6,6,4,1,OL]]:[];
    sprite([...bodyRects(hair,shirt,pants),...ex], x-8*s,y-24*s,s);
  }
  function personAt(cx,cy,s,rot,hair,shirt,pants){ ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);sprite(bodyRects(hair,shirt,pants),-8*s,-12*s,s);ctx.restore(); }

  function text(str,x,y,size,color,font,align){ ctx.fillStyle=color;ctx.textAlign=align||'center';ctx.textBaseline='alphabetic';ctx.font=size+"px '"+(font||'VT323')+"'";ctx.fillText(str,x,y); }
  function stamp(str,x,y,size,color,sh){ ctx.textAlign='center';ctx.font=size+"px 'Press Start 2P'";ctx.fillStyle=sh;ctx.fillText(str,x+4,y+4);ctx.fillStyle=color;ctx.fillText(str,x,y); }
  function bubble(cx,cy,w,h,lines,size){
    cx=Math.max(w/2+6,Math.min(W-w/2-6,cx));
    ctx.fillStyle='#F4F4E8';ctx.fillRect(cx-w/2,cy-h,w,h);
    ctx.fillStyle='#241f1b';ctx.fillRect(cx-w/2,cy-h,w,3);ctx.fillRect(cx-w/2,cy-3,w,3);ctx.fillRect(cx-w/2,cy-h,3,h);ctx.fillRect(cx+w/2-3,cy-h,3,h);
    ctx.fillRect(cx-5,cy,10,8);
    lines.forEach((l,i)=> text(l,cx,cy-h+(h-6)/(lines.length+1)*(i+1)+size*0.35, size,'#241f1b'));
  }

  // ---------- geometry ----------
  const HOME={x:320,y:430},FIRST={x:474,y:320},SECOND={x:320,y:206},THIRD={x:166,y:320},MOUND={x:320,y:318},BODYPT={x:338,y:216};
  const DEF=[[MOUND.x,MOUND.y-6],[320,462],[498,330],[258,250],[384,250],[150,300],[128,150],[320,104],[512,150]];
  const lp=(a,b,t)=>{t=Math.max(0,Math.min(1,t));return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};};
  const arc=(a,b,t,h)=>{const p=lp(a,b,t);p.y-=Math.sin(Math.max(0,Math.min(1,t))*Math.PI)*h;return p;};
  const near=(a,b,r)=>Math.hypot(a.x-b.x,a.y-b.y)<r;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  function nearestDefIdx(t){let bi=0,bd=1e9;DEF.forEach((d,i)=>{const dd=Math.hypot(d[0]-t.x,d[1]-t.y);if(dd<bd){bd=dd;bi=i;}});return bi;}

  function drawField(){
    ctx.fillStyle='#4C9E5A';ctx.fillRect(0,56,W,H-56);
    ctx.fillStyle='#479455';for(let i=0;i<8;i++)ctx.fillRect(0,72+i*54,W,27);
    ctx.fillStyle='#D1A05B';ctx.beginPath();ctx.moveTo(320,188);ctx.lineTo(496,320);ctx.lineTo(320,452);ctx.lineTo(144,320);ctx.closePath();ctx.fill();
    ctx.fillStyle='#4C9E5A';ctx.beginPath();ctx.moveTo(320,232);ctx.lineTo(452,320);ctx.lineTo(320,408);ctx.lineTo(188,320);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#F4F4E8';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.lineTo(THIRD.x,THIRD.y);ctx.closePath();ctx.stroke();
    ctx.fillStyle='#C89350';ctx.beginPath();ctx.ellipse(MOUND.x,MOUND.y,30,12,0,0,7);ctx.fill();
    const base=(b,sz)=>{ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#F4F4E8';ctx.fillRect(-sz/2,-sz/2,sz,sz);ctx.restore();};
    base(FIRST,20);base(SECOND,20);base(THIRD,20);base(HOME,24);
    ctx.fillStyle='#F4F4E8aa';ctx.font="20px 'VT323'";ctx.textAlign='left';ctx.fillText('◀ BBQ',6,250);
  }
  function drawDefense(skipA,skipB){ DEF.forEach((d,i)=>{ if(i!==skipA && i!==skipB) fielder(d[0],d[1],2.0,'#B23B3B','#DDE3EA'); }); }
  function drawDownedVega(){
    if(!vegaOnField)return;
    ctx.fillStyle='#8E1B1B';ctx.beginPath();ctx.ellipse(338,222,30+hitCount*4,12+hitCount,0,0,7);ctx.fill();
    ctx.fillStyle='#C62828';ctx.beginPath();ctx.ellipse(336,221,20,7,0,0,7);ctx.fill();

    for(let i=0;i<Math.min(spots.length,2+hitCount);i++) ctx.fillRect(spots[i][0],spots[i][1],5,5);

    text('x   x',330,206,14,'#241f1b');
  }
  function scoreboard(){
    ctx.fillStyle='#1B1B22';ctx.fillRect(0,0,W,56);
    text('UIT',16,36,12,'#E8E8E8','Press Start 2P','left');
    for(let i=0;i<3;i++){ctx.fillStyle=i<outs?'#E94B3C':'#2E2E38';ctx.fillRect(74+i*18,24,12,12);}
    text('INN '+inning,W-16,36,12,'#9AA3AD','Press Start 2P','right');

  // ---------- bbq ----------
  const NPCS=[
    {x:150,y:250,hair:'#3a2a18',shirt:'#2E6DB4',pants:'#3B3B46',line:["Hamburgers! Lekker veel."],talked:false,isVega:false,gone:false},

      case 'pitch': { const p=(now()-t0)/PITCH_MS,d=Math.abs(p-C);
        if(d<0.12){beginPlay();} else {strikes++; if(strikes>=3){outReason=pick(STRIKE_OUTS);beginOut();}else go('miss');} break; }
      case 'out': advanceFromOut();break;
      case 'video': if(!document.getElementById('vidClose').classList.contains('hidden'))closeVideo();break;
      case 'bbq': if(nearNPC){
          talkNPC=nearNPC;
          if(!talkNPC.talked){talkNPC.talked=true;talkedCount++;}
          if(!vegaDone && (talkNPC.isVega||talkedCount===3)){ talkNPC.isVega=true; talkLines=VEGA_LINE; }
          else talkLines=talkNPC.line;
          go('bbqTalk');
        } break;
      case 'bbqTalk': (talkNPC&&talkNPC.isVega&&!vegaDone)?go('bbqRage'):go('bbq');break;
      case 'bbqRage': startKick();break;
    }
  }
  startBtn.addEventListener('click',startGame);
  window.addEventListener('keydown',e=>{keys[e.code]=true; if(e.code==='Space'||e.code==='Enter'){e.preventDefault();act();} if(e.code.startsWith('Arrow'))e.preventDefault();});
  window.addEventListener('keyup',e=>{keys[e.code]=false;});
  if(matchMedia('(pointer:coarse)').matches)touchUI.classList.add('on');
  const joyEl=document.getElementById('joy'), knob=document.getElementById('knob');
  function joyStart(e){ const r=joyEl.getBoundingClientRect(); joy.cx=r.left+r.width/2; joy.cy=r.top+r.height/2; joy.id=e.pointerId; joyMove(e); }
  function joyMove(e){ if(joy.id!==e.pointerId)return; const dx=e.clientX-joy.cx, dy=e.clientY-joy.cy; const d=Math.hypot(dx,dy)||0.0001; const m=Math.min(1,d/joy.R), nx=dx/d, ny=dy/d; joy.vx=nx*m; joy.vy=ny*m; const kd=Math.min(d,joy.R); knob.style.transform='translate('+(nx*kd)+'px,'+(ny*kd)+'px)'; }
  function joyEnd(e){ if(e&&joy.id!==e.pointerId)return; joy.id=null; joy.vx=0; joy.vy=0; knob.style.transform='translate(0,0)'; }
  joyEl.addEventListener('pointerdown',e=>{e.preventDefault(); try{joyEl.setPointerCapture(e.pointerId);}catch(_){ } joyStart(e);});
  joyEl.addEventListener('pointermove',e=>{e.preventDefault(); joyMove(e);});
  joyEl.addEventListener('pointerup',joyEnd); joyEl.addEventListener('pointercancel',joyEnd);
  document.getElementById('swingBtn').addEventListener('pointerdown',e=>{e.preventDefault();act();});
  document.getElementById('vidWatch').addEventListener('click',()=>{ document.getElementById('vidClose').classList.remove('hidden'); });
  document.getElementById('vidClose').addEventListener('click',e=>{e.preventDefault();closeVideo();});
  cv.addEventListener('pointerdown',e=>{ if(['title','roam','ready','pitch','miss','out','bbqTalk'].includes(state)){e.preventDefault();act();} },{passive:false});
})();
</script>
